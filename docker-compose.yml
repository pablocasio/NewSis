services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsis
      POSTGRES_PASSWORD: newsis_local_pass
      POSTGRES_DB: newsis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsis -d newsis"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Contenedor de un solo uso: aplica las migraciones y el seed antes de que
  # arranquen la app y el worker.
  migrate:
    build:
      context: .
      target: worker
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://newsis:newsis_local_pass@db:5432/newsis"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed || true"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://newsis:newsis_local_pass@db:5432/newsis"
    ports:
      - "3010:3000"

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://newsis:newsis_local_pass@db:5432/newsis"
    command: ["npx", "tsx", "scripts/worker.ts"]

volumes:
  pgdata: